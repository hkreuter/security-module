services:
  _defaults:
    public: false
    autowire: true

  OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\ModuleSettingsServiceInterface:
    class: OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\ModuleSettingsService
    public: true

  OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\OTPGeneratorServiceInterface:
    class: OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\OTPGeneratorService

  OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\OTPValidatorServiceInterface:
    class: OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\OTPValidatorService

  OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\ExpirationServiceInterface:
    class: OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\ExpirationService

  OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\OTP\OTPAttemptServiceInterface:
    class: OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\OTP\OTPAttemptService

  OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\OTP\OTPServiceInterface:
    class: OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Service\OTP\OTPService

  OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Infrastructure\Repository\OTPRepositoryInterface:
    class: OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Infrastructure\Repository\OTPRepository

  OxidEsales\SecurityModule\Authentication\TwoFactorAuth\Infrastructure\Provider\Email\EmailFactoryInterface:
